# ==============================================================================
# Ambiente: STAGING (namespace `staging`)
# Maior disponibilidade (2 réplicas da API) e limites de recursos mais folgados.
# ==============================================================================

replicaCount: 2

image:
  tag: "sha-812ed49cfee329733e1ed56d5145d3a36cbb3edb"

app:
  name: "DevOps API (staging)"

resources:
  requests:
    cpu: 100m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 384Mi

postgresql:
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi

gatewayApi:
  enabled: true
  hostnames:
    - "staging.api.local"

# Desafio Opcional Habilitado em Staging:
# Argo Rollouts Canary com divisão real de tráfego via Gateway API (Envoy Gateway)
rollout:
  enabled: true
  steps:
    - setWeight: 20
    - pause: { duration: 15s }
    - setWeight: 50
    - pause: { duration: 15s }
    - setWeight: 100
